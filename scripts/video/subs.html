<!doctype html>
<!-- Burned-in subtitle strip for FINAL-subtitled.mp4: one cream paper pill, bottom centre.
     render({ w, h, text, size }) where text may contain one "\n" line break. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #strip { position: relative; overflow: hidden; }
  #pill {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    max-width: 1500px; padding: 12px 30px 14px; border-radius: 12px;
    background: rgba(244, 236, 216, 0.93); color: #2f3944;
    box-shadow: 0 2px 10px rgba(47, 57, 68, 0.22), inset 0 0 0 1px rgba(138, 130, 116, 0.35);
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    line-height: 1.28; text-align: center; white-space: pre; letter-spacing: 0.005em;
  }
</style>
</head>
<body>
<div id="strip"><div id="pill"></div></div>
<script>
  window.render = (s) => {
    const strip = document.getElementById("strip"), pill = document.getElementById("pill");
    strip.style.width = s.w + "px"; strip.style.height = s.h + "px";
    pill.style.fontSize = (s.size || 40) + "px";
    pill.textContent = s.text;
  };
  window.seek = () => {};
  window.bounds = () => { const r = document.getElementById("pill").getBoundingClientRect(); return [{ l: r.left, t: r.top, r: r.right, b: r.bottom }]; };
</script>
</body>
</html>
